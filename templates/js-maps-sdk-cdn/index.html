<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>ArcGIS Maps SDK for JavaScript CDN template</title>
    <link rel="icon" href="data:;base64,=" />
    <style>
      :root {
        --calcite-color-brand: #b34b00;
        --calcite-color-brand-hover: #9f4504;
        --calcite-color-brand-press: #803703;
        --calcite-color-focus: #b34b00;
        --calcite-color-background: #faf3e3;
        --calcite-color-foreground-1: #fffaed;
        --calcite-color-foreground-2: #fae9c8;
        --calcite-color-foreground-3: #fce5b6;
        --calcite-color-foreground-current: #ebd09d;
      }

      html,
      body {
        background-color: var(--calcite-color-background);
        height: 100%;
        margin: 0;
      }

      calcite-navigation-logo {
        --calcite-navigation-logo-heading-text-color: var(--calcite-color-brand);
      }

      arcgis-chart {
        width: min(clamp(360px, 40dvw, 640px), calc(100dvw - 80px));
        height: clamp(250px, 40dvh, 400px);
      }
    </style>
    <!-- Load the ArcGIS Maps SDK for JavaScript from the CDN -->
    <script type="module" src="https://js.arcgis.com/5.2/"></script>

    <!-- Optional: If you're loading secure web maps -->
    <!-- Configure the IdentityManager before the SDK's components load -->

  </head>

  <body>
    <!-- The Shell component is used as a layout for this template -->
    <calcite-shell content-behind>
      <calcite-navigation slot="header">
        <!-- Heading and description dynamically populated below using JavaScript -->
        <calcite-navigation-logo heading-level="1" slot="logo"></calcite-navigation-logo>
      </calcite-navigation>

      <!-- The Map component fits to the size of the parent element -->
      <!-- The basemap, extent, zoom and more are provided by the Web Map (item-id) -->
      <!-- Note: popup-component-enabled enables the Popup component (beta). See https://developers.arcgis.com/javascript/latest/references/map-components/components/arcgis-map/#popupComponentEnabled for details. -->
      <arcgis-map item-id="dd4b2f25487d4a37a45093ba6acd026d" popup-component-enabled>
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <arcgis-search slot="top-right"></arcgis-search>
        <arcgis-expand slot="bottom-left">
          <arcgis-legend></arcgis-legend>
        </arcgis-expand>
        <!-- A Feature Layer in the Web Map has an associated chart (layer-item-id) -->
        <arcgis-chart
          layer-item-id="b1717962dab247ad93eaca257b32fe02"
          chart-index="0"
          slot="bottom-right"
        ></arcgis-chart>
      </arcgis-map>
    </calcite-shell>
  </body>

  <script type="module">
    // Import modules from the SDK's core API
    const summaryStatistics = await $arcgis.import("@arcgis/core/smartMapping/statistics/summaryStatistics.js");
    const ExpressionContent = await $arcgis.import("@arcgis/core/popup/content/ExpressionContent.js");

    const viewElement = document.querySelector("arcgis-map");
    const calciteNavLogo = document.querySelector("calcite-navigation-logo");

    viewElement.addEventListener("arcgisViewReadyChange", async () => {
      // Use metadata from the Web Map to populate the header
      const { title, description } = viewElement.map.portalItem;

      if (calciteNavLogo) {
        calciteNavLogo.heading = title === "" ? "A web map" : title;
        calciteNavLogo.description = description === "" ? "ArcGIS Maps SDK for JavaScript template" : description;
      }

      // Configure the layers shown in the map
      const wheatLayerGroup = viewElement.map.allLayers.find((layer) => layer.title === "Types of wheat over time");
      wheatLayerGroup.visible = false;

      const productionLayer = viewElement.map.allLayers.find(
        (layer) => layer.title === "Harvested wheat - 2022 (Spike map)",
      );
      productionLayer.visible = true;

      // Calculate the layer average and use an Arcade expression to compare each feature to it in the popup.
      const { avg } = await summaryStatistics({ layer: productionLayer, field: "Wheat_prod_2022" });
      const popupContent = productionLayer.popupTemplate.content;
      if (Array.isArray(popupContent)) {
        popupContent.unshift(
          new ExpressionContent({
            expressionInfo: {
              expression: `
                var production = $feature.Wheat_prod_2022;
                var ratio = production / ${avg};
                return {
                  type: "text",
                  text: When(
                    IsEmpty(production), "No 2022 wheat production was reported for this county.",
                    "In 2022, this county produced <strong>about " +
                      Text(ratio, IIf(ratio < 0.1, "#0.0####", "#0.0#")) +
                      " times as much</strong> wheat as the average U.S. county."
                  )
                };
              `,
            },
          }),
        );
      }
    });
  </script>
</html>
